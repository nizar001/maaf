<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffe0ee">
<title>Maaf yaa 🥺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<button id="mu" type="button" aria-label="Musik" hidden>🔊</button>
<div id="ts" role="status"></div>
<div id="sp" role="status"></div>

<main class="sc on" id="s1"><div class="in">
  <div class="bw"><div class="bear" id="b1"></div><i class="shd"></i></div>
  <h1 id="h1">aloooooooo cayaanggggg👋</h1>
  <p>masukinn namaa duluuu sayangggg 🥺</p>
  <input id="nm" type="text" name="nama" maxlength="20" placeholder="Tulis namamu di sini…" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go">
  <button class="btn go" id="go" type="button">Lanjut ✨</button>
</div></main>

<main class="sc" id="s2"><div class="in">
  <div class="bw sm"><div class="bear" id="b2"></div></div>
  <div class="ph" id="ph"></div>
  <h2 id="hi"></h2>
  <p class="msg" id="tx"></p>
  <div class="q" id="q">
    <h3>Mau happy lagi nggak? 🥰</h3>
    <button class="btn yes" id="yes" type="button">mauu sayangggggg 😍</button>
    <button class="btn no" id="no" type="button">ga 😤</button>
  </div>
  <div class="q" id="fm">
    <h3>Kirim pesan buat aku 💌</h3>
    <input id="fn" type="text" maxlength="20" placeholder="Namamu" autocomplete="off">
    <textarea id="fp" rows="3" maxlength="300" placeholder="Tulis pesanmu di sini…"></textarea>
    <button class="btn go" id="wa" type="button">Kirim ke WhatsApp 📲</button>
  </div>
</div></main>

</div>
<script src="script.js"></script>
</body>
</html>
